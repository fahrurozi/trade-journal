name: Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:development
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy development
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          if [[ -z "$DOKPLOY_WEBHOOK_URL" ]]; then
            echo "::notice::Development deployment is disabled until DOKPLOY_WEBHOOK_URL is configured."
            exit 0
          fi
          payload=$(jq -nc --arg image "$IMAGE:development" \
            '{registry_package: {package_version: {package_url: $image}}}')
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --max-time 30 --request POST \
            --header 'Content-Type: application/json' \
            --header 'X-GitHub-Event: registry_package' \
            --data "$payload" "$DOKPLOY_WEBHOOK_URL")
          [[ "$status" == 200 ]] || { echo "Dokploy webhook returned HTTP $status"; exit 1; }
